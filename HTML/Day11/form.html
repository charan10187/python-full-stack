<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset style="width: 100%;">
        <legend>form</legend>
    <form action="https://www.instagram.com">
        
        <label for="user">User name</label>
        <input type="text" required id="user" placeholder="user name"><br><br>
        
        <label for="password">password</label>
        <input type="password" required id="password" placeholder="password"><br><br>
        
        <label for="">Mobile </label>
        <input type="tel" required pattern="[0-9]{10}"><br><br>
        
        <label for="email">Email_ID</label>
        <input type="email" pattern="[1-0]"><br><br>

        <label for="dob">DOB</label>
        <input type="date" name="" id="dob" required min="2000-01-01" max="2026-01-01"><br><br>

        <label for="Age">Age</label>
        <input type="number" id="Age" min="18" max="28"><br><br>

        <label for="gender">gender</label>
        <input type="radio" name="gender">male
        <input type="radio" name="gender">female
        <input type="radio" name="gender">others
        <br><br>

        <label for="">skills :</label>
        <input type="checkbox">wed
        <input type="checkbox"checked disabled>python
        <input type="checkbox">sql <br><br>
        <input type="checkbox"> I agree all terms & conditions
        <br><br>

        <label for="state">state :</label>
        <select name="" id="">
            <option value="" selected >choose option</option>
            <option value="state">Andhra pradesh</option>
            <option value="state">Telengana </option>
            <option value="state">Tamil nadu</option>
            <option value="state">Karnataka</option>

        </select>


        <br><br>
        <input type="submit" value="login">
        <input type="reset" value="Clear All">
    </form>
    </fieldset>
    
</body>
</html>
