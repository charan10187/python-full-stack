<!--   Point: it is a typography unit equal to 1/72 inch, used for front size and spacing -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Units</title>
    <link rel="stylesheet" href="./units.css">
</head>
<body>
    <h1 id="cm"> this is centimeter</h1>
    <h1 id="mm"> this is milimeter</h1>
    <h1 id="in"> this is inch</h1>
    <h1 id="px"> this is pixel</h1>
    <h1 id="pc"> this is picas</h1>

    <!-- relative  -->
     <div id="vw"> this is viewport width</div>
     <div id="vh"> this is viewport height</div>
</body>
</html>
