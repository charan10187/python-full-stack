<!DOCTYPE html>
<html>
<head> 
  <style>
    /* Select by element */
    p {
      color: blue;
      font-size: 18px;
    }

    /* Select by class */
    .highlight {
      background-color: yellow;
    }

    /* Select by ID */
    #special {
      font-weight: bold;
      color: red;
    }
  </style>
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <p>This is a normal paragraph.</p>
  <p class="highlight">This one is highlighted.</p>
  <h1 id="special">This one is special!</h1>
</body>
</html>
