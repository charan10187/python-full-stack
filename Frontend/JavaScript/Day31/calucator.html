<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./calucator.css">
</head>
<body>

    <div id="main">
        <div>
            <input type="text" name="display" value=" " >
        </div>
        <div>
            <input class="three" type="button" value="AC" onclick="display.value=' '">
            <input class="three" type="button" value="DEL" onclick="display.value='display.value.tostring().slice(0,-1)'">
            <input class="three" type="button" value="/" onclick="display.value+='/'">
        </div>
        <div>
            <input type="button" value="7" onclick="display.value+='7'">
            <input type="button" value="8" onclick="display.value='display.value.tostring().slice(0,-1)'">
            <input type="button" value="9" onclick="display.value='display.value.tostring().slice(0,-1)'">
            <input type="button" value="+" onclick="display.value='display.value.tostring().slice(0,-1)'">
        </div>
        <div>
            <input type="button" value="4" onclick="display.value=' '">
            <input type="button" value="5" onclick="display.value='display.value.tostring().slice(0,-1)'">
            <input type="button" value="6" onclick="display.value='display.value.tostring().slice(0,-1)'">
            <input type="button" value="-" onclick="display.value='display.value.tostring().slice(0,-1)'">
        </div>
        <div>
            <input type="button" value="1" onclick="display.value=' '">
            <input type="button" value="2" onclick="display.value='display.value.tostring().slice(0,-1)'">
            <input type="button" value="3" onclick="display.value='display.value.tostring().slice(0,-1)'">
            <input type="button" value="*" onclick="display.value='display.value.tostring().slice(0,-1)'">
        </div>
        <div>
            <input class="three" type="button" value="0" onclick="display.value=' '">
            <input class="three" type="button" value="00" onclick="display.value='display.value.tostring().slice(0,-1)'">
            <input class="three" type="button" value="=" onclick="display.value='display.value.tostring().slice(0,-1)'">
        </div>
            </div>
</body>
</html>
