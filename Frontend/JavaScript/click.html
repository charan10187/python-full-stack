<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./click.js" defer></script>
    <style>


*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    height: 100vh;
    background-image: radial-gradient(orange, lightblue,violet,gold,darkgreen);
    display: flex;
    justify-content: center;
    align-items: center;

}
#container{
    width: 400px;
    height: 100px;
    background-color: white;
    border-radius: 25px;
}
input{
    width: 32.65%;
    height: 100%;
    border: none;
    border-radius: 80%;
    text-align: center;
    font-size: 50px;
}
    </style>
</head>
<body>
    <div id="container">
    <input type="button" value="-" onclick="dec()">
    <input type="number" value="0" readonly id="result">
    <input type="button" value="+" onclick="inc()">
    </div>
</body>
